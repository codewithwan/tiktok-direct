[package]
name = "tiktok-direct-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tiktok_direct"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
serde_json = "1.0.150"
tiktok_direct_engine = { package = "engine", version = "0.1.0", path = "../../crates/engine" }

