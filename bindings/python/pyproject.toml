[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "tiktok-direct"
version = "0.1.0"
description = "Python binding for tiktok-direct Rust core."
requires-python = ">=3.9"
license = "MIT"

[tool.maturin]
module-name = "tiktok_direct"
python-source = "python"
features = ["pyo3/extension-module"]

