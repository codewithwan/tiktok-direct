[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "tiktok-direct"
version = "0.1.0"
description = "Python binding for tiktok-direct Rust core."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "codewithwan", email = "codewithwan@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/codewithwan/tiktok-direct"
Repository = "https://github.com/codewithwan/tiktok-direct"

[tool.maturin]
module-name = "tiktok_direct"
features = ["pyo3/extension-module"]
