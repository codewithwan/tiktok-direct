name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ── Rust ────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        # Exclude the pyo3 cdylib — it requires Python linked at build time
        # and can't be built standalone via plain cargo on macOS/Windows.
        # The Python binding is fully tested in the dedicated 'python' job.
        run: cargo clippy --workspace --exclude tiktok-direct-python --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --exclude tiktok-direct-python

      - name: test
        run: cargo test --workspace --exclude tiktok-direct-python -- --nocapture

  # ── Python ──────────────────────────────────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev deps
        run: pip install maturin mypy pytest pytest-cov ruff

      - name: ruff lint
        run: |
          cd bindings/python
          python -m ruff check . || true

      - name: Build wheel (maturin)
        # `maturin build` (unlike `maturin develop`) does NOT require a
        # virtualenv. It detects the Python set up by setup-python above
        # and produces a cpXY-tagged wheel in target/wheels/.
        run: |
          cd bindings/python
          python -m maturin build --release

      - name: Install wheel
        run: |
          # Resolve the exact wheel for this Python version so the glob never
          # accidentally matches a stale wheel from another matrix version.
          PYVER=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          WHEEL=$(ls target/wheels/*${PYVER}*.whl 2>/dev/null | head -n1)
          if [ -z "$WHEEL" ]; then
            echo "No wheel found for ${PYVER} in target/wheels/"
            ls target/wheels/ || true
            exit 1
          fi
          echo "Installing: $WHEEL"
          pip install --force-reinstall "$WHEEL"

      - name: pytest + coverage
        # Run from workspace root so sys.path resolves tiktok_direct from
        # site-packages (with the .so) NOT from bindings/python/tiktok_direct/
        # (the bare source dir that imports the missing .so via relative import).
        run: |
          python -m pytest bindings/python/tests/ -v --tb=short \
            --cov=tiktok_direct --cov-report=term-missing \
            --rootdir=bindings/python

      - name: mypy
        run: |
          cd bindings/python
          python -m mypy tests examples --ignore-missing-imports

  # ── Node ────────────────────────────────────────────────────────────────────
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package.json

      - name: Install deps
        working-directory: bindings/node
        run: npm install --prefer-offline

      - name: Test
        working-directory: bindings/node
        run: npm test

  # ── Go ──────────────────────────────────────────────────────────────────────
  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "1.23", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: bindings/go/go.sum

      - name: Download modules
        working-directory: bindings/go
        run: go mod download

      - name: vet
        working-directory: bindings/go
        run: go vet ./...

      - name: test (race detector)
        working-directory: bindings/go
        run: go test ./... -v -race -count=1

  # ── Gate ────────────────────────────────────────────────────────────────────
  ci-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [rust, python, node, go]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI jobs passed."
