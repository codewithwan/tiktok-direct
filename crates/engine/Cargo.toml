[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tiktok_direct_engine"
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
html-escape = "0.2.13"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"

